name: Deploy Portfolio to GitHub Pages

# ─────────────────────────────────────────────────────────────────────────────
# Professional CI/CD pipeline for the portfolio.
#
# Triggers:
#   • Push to main  — automatic deploy on every commit
#   • workflow_dispatch — manual "Run workflow" button in the Actions tab
#
# Prerequisites (one-time):
#   Repo Settings → Pages → Build and deployment → Source: "GitHub Actions"
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions required by the official Pages deployment actions
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; cancel any in-flight run
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # BUILD — install deps, type-check, and produce the production bundle
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Build production bundle
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ─────────────────────────────────────────────────────────────────────────
  # DEPLOY — publish the built artifact to GitHub Pages
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4